name: Update Okara Enrollment
# fresh SIS run trigger

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Karachi"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-enrollment.yml"

permissions:
  contents: write

concurrency:
  group: okara-enrollment-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas openpyxl beautifulsoup4

      - name: Fetch live SIS enrollment
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "Enrollment collection attempt ${attempt}/3"
            if python update_enrollment.py; then
              echo "Enrollment collection completed successfully."
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Collection failed. Waiting 30 seconds before retry..."
              sleep 30
            else
              echo "All enrollment collection attempts failed."
              exit 1
            fi
          done

      - name: Verify latest workbook
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          p = Path("data/Okara_Latest_Enrollment_Gender_Latest.xlsx")
          if not p.exists():
              raise SystemExit("Latest enrollment workbook was not created.")

          wb = load_workbook(p, read_only=True)
          required = {"School Wise", "Markaz Wise", "Tehsil Wise", "Wing Summary", "Gender Summary"}
          missing = required - set(wb.sheetnames)
          if missing:
              wb.close()
              raise SystemExit(f"Workbook is missing sheets: {sorted(missing)}")

          ws = wb["School Wise"]
          rows = ws.max_row - 1
          wb.close()

          if rows <= 0:
              raise SystemExit("Latest enrollment workbook contains no school data.")

          print(f"PASS: latest enrollment workbook verified with {rows} school rows.")

      - name: Commit latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Sync to the latest remote commit BEFORE creating the data commit.
          # This avoids rebase/push conflicts when dashboard files are updated separately.
          git fetch origin main
          git reset --mixed origin/main

          git add data/
          if git diff --cached --quiet; then
            echo "No enrollment data change detected."
          else
            git commit -m "Update latest Okara enrollment"
            for push_attempt in 1 2 3; do
              if git push origin HEAD:main; then
                echo "Latest enrollment data pushed successfully."
                exit 0
              fi
              echo "Push conflict detected on attempt ${push_attempt}. Refreshing remote..."
              git fetch origin main
              git reset --mixed origin/main
              git add data/
              if git diff --cached --quiet; then
                echo "Remote already contains the latest data."
                exit 0
              fi
              git commit -m "Update latest Okara enrollment"
              sleep 5
            done
            echo "Push failed after 3 attempts."
            exit 1
          fi

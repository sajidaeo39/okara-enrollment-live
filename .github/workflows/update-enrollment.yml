name: Update Okara Enrollment

on:
  schedule:
    # First attempt: 06:55 Pakistan time (avoids the busy top-of-hour trigger)
    - cron: "55 6 * * *"
      timezone: "Asia/Karachi"
    # Backup attempt: 07:10 Pakistan time if the first scheduled run is delayed or SIS is not ready
    - cron: "10 7 * * *"
      timezone: "Asia/Karachi"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install --upgrade requests pandas openpyxl beautifulsoup4

      - name: Fetch live SIS enrollment
        run: python update_enrollment.py

      - name: Commit latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily Okara enrollment update"
          git push

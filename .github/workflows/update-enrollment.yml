name: Update Okara Enrollment

on:
  schedule:
    - cron: "0 7 * * *"
      timezone: "Asia/Karachi"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-enrollment.yml"

permissions:
  contents: write

concurrency:
  group: okara-enrollment-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas openpyxl beautifulsoup4

      - name: Fetch live SIS enrollment
        run: |
          set -u
          for attempt in 1 2 3; do
            echo "Enrollment collection attempt ${attempt}/3"
            if python update_enrollment.py; then
              echo "Enrollment collection completed successfully."
              break
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Collection failed. Waiting 30 seconds before retry..."
              sleep 30
            else
              echo "All enrollment collection attempts failed."
              exit 1
            fi
          done

      - name: Verify latest workbook
        run: |
          python - <<'PY'
          from pathlib import Path
          from openpyxl import load_workbook

          p = Path("data/Okara_Latest_Enrollment_Gender_Latest.xlsx")
          if not p.exists():
              raise SystemExit("Latest enrollment workbook was not created.")

          wb = load_workbook(p, read_only=True)
          required = {"School Wise", "Markaz Wise", "Tehsil Wise", "Wing Summary", "Gender Summary"}
          missing = required - set(wb.sheetnames)
          if missing:
              wb.close()
              raise SystemExit(f"Workbook is missing sheets: {sorted(missing)}")

          ws = wb["School Wise"]
          rows = ws.max_row - 1
          wb.close()

          if rows <= 0:
              raise SystemExit("Latest enrollment workbook contains no school data.")

          print(f"PASS: latest enrollment workbook verified with {rows} school rows.")

      - name: Commit latest data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No enrollment data change detected."
          else
            git commit -m "Update latest Okara enrollment"
            git push
          fi

let rows=[],currentView='school',reportDate='',reportDateTime='';

const pick=(o,a)=>{for(const n of a)if(o[n]!==undefined&&o[n]!==null)return o[n];return ''};

function targetFor(r){let t=TARGETS.find(x=>x.emis===r.emis)||TARGETS.find(x=>x.school.toLowerCase()===r.school.toLowerCase());return t||{maleTarget:0,femaleTarget:0,totalTarget:0}}
function normalize(raw){
 return raw.map(o=>{
  let r={emis:String(pick(o,aliases.emis)).trim(),school:String(pick(o,aliases.school)).trim(),tehsil:String(pick(o,aliases.tehsil)).trim(),markaz:String(pick(o,aliases.markaz)).trim(),wing:String(pick(o,aliases.wing)).trim(),male:Math.round(num(pick(o,aliases.male))),female:Math.round(num(pick(o,aliases.female))),other:Math.round(num(pick(o,aliases.other)))};

 });

function schoolTable(list){return{headers:schoolHeaders,data:list.map(r=>[r.school,r.emis,r.tehsil,r.markaz,r.wing,r.male,r.maleTarget,r.remainingBoys,r.female,r.femaleTarget,r.remainingGirls,r.total,r.totalTarget,r.remainingTotal,Math.round(r.achievement*10)/10+'%'])}}

}

async function loadWorkbookBuffer(buffer, sourceName){

}

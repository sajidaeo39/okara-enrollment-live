<style>:root{--blue:#0b5ed7;--dark:#17345f;--bg:#f4f7fb;--card:#fff;--line:#dfe5ee;--muted:#667085;--red:#c62828;--green:#16803c;--content:100%;--control-h:38px;--page-gutter:clamp(12px,2.2vw,32px)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#fff;font-family:Segoe UI,Arial,sans-serif;color:#172033}
header{background:#fff;color:#17344d;padding:8px 0 9px;box-shadow:0 2px 10px rgba(23,52,77,.055);border-bottom:1px solid #e2eaf2}
header .wrap{text-align:center}
header h1{margin:0;font-size:23px;font-weight:750;letter-spacing:.1px;color:#17344d}
.dashboard-title{text-align:center;line-height:1.2;display:block;max-width:none;margin:0 auto;padding:8px 16px;border:0;border-radius:10px;background:#f4f8fc;box-shadow:none}
header p{margin:4px 0 0;color:#52657a;font-size:11px;letter-spacing:.15px}
.byline{font-weight:600;color:#52657a!important;font-size:11px!important;margin-top:4px!important}
.wrap{width:calc(100% - (2 * clamp(18px,3vw,42px)));max-width:1500px;margin:0 auto;padding:8px 0}
.upload{background:#fff;border:2px dashed #9db5d8;border-radius:11px;padding:16px;text-align:center;margin-bottom:12px}
.hint{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;width:100%;margin:0 0 11px}
.card{background:#fff;border:1px solid #dfe7ef;border-radius:10px;padding:8px 7px;box-shadow:0 2px 8px rgba(25,54,79,.055);min-width:0;height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:box-shadow .15s ease,transform .15s ease}
.card:hover{box-shadow:0 4px 10px rgba(25,54,79,.08);transform:translateY(-1px)}
.card:before{display:none}
.card:nth-child(6n+1){background:#f2f7fb}.card:nth-child(6n+1) .num{color:#315b7d}
.card:nth-child(6n+2){background:#f2f8f6}.card:nth-child(6n+2) .num{color:#246c5c}
.card:nth-child(6n+3){background:#f1f8f4}.card:nth-child(6n+3) .num{color:#24784f}
.card:nth-child(6n+4){background:#fff5f2}.card:nth-child(6n+4) .num{color:#a84e40}
.card:nth-child(6n+5){background:#fff9ee}.card:nth-child(6n+5) .num{color:#916a1c}
.card:nth-child(6n){background:#f5f3fb}.card:nth-child(6n) .num{color:#66599c}
.label{font-size:9.5px;color:#5f7080;font-weight:650;letter-spacing:.05px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.num{font-size:18px;line-height:1.1;font-weight:750;margin-top:4px;text-align:center}
.tabs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:9px;width:100%;margin:0 0 10px;padding:0;overflow:hidden}
.tab{background:#fff;border:1px solid #cbd5e1;border-radius:7px;padding:0 6px;height:var(--control-h);min-width:0;width:100%;white-space:nowrap;font-size:11px;font-weight:650;cursor:pointer;display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.toolbar{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:nowrap;width:100%;background:#fff;border:1px solid var(--line);padding:9px;border-radius:10px;margin:0 0 10px;box-shadow:0 2px 7px rgba(25,54,79,.04);overflow-x:auto}
.toolbar input,.toolbar select,.toolbar .action{height:var(--control-h);box-sizing:border-box}
.toolbar input,.toolbar select{padding:0 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font:12px Segoe UI,Arial,sans-serif;color:#172033;flex:0 0 auto}
.toolbar input{min-width:0;width:min(340px,30vw);flex:1 1 340px}
.toolbar select{min-width:105px;width:105px}.toolbar #schoolLimit{width:120px;min-width:120px}
.toolbar .action{border:0;border-radius:7px;padding:0 12px;background:#0f766e;color:#fff;font:650 12px Segoe UI,Arial,sans-serif;cursor:pointer;white-space:nowrap;min-width:112px}
.toolbar .pdf{background:#b42318}
.note{font-size:11px;color:var(--muted);margin:4px 0 7px}
.tablebox{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:68vh}
table{border-collapse:collapse;width:100%;font-size:10px;table-layout:fixed}
th,td{padding:9px 5px;white-space:normal;overflow-wrap:anywhere;word-break:break-word;line-height:1.3;border-bottom:1px solid var(--line);text-align:center!important;vertical-align:middle!important;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#edf4fd;z-index:1}
th:first-child,td:first-child{text-align:center!important}
th:nth-child(2),td:nth-child(2){text-align:left!important}
th:not(:first-child),td:not(:first-child){text-align:center!important}
td,th{vertical-align:middle}
td:not(:first-child){font-size:clamp(8px,0.72vw,10px);letter-spacing:-.05px}
td:first-child{font-weight:500}
.negative{color:var(--red);font-weight:700}.positive{color:var(--green);font-weight:700}.rank{font-weight:700}
@media(min-width:701px){

async function loadWorkbookBuffer(buffer, sourceName){
 const dateMatch=String(sourceName||'').match(/(20\\d{2}[-_]\\d{2}[-_]\\d{2})/);

 let sheet=wb.Sheets['School Wise']||wb.Sheets[wb.SheetNames[0]];
 let raw=XLSX.utils.sheet_to_json(sheet,{defval:''});
 let first=raw[0]||{};
 let d=pick(first,['Run Date','Date']);
 if(d){let dt=d instanceof Date?d:new Date(d);if(!isNaN(dt)){reportDate=dt.toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'});reportDateTime=dt.toLocaleDateString('en-GB',{timeZone:'Asia/Karachi'})+' '+dt.toLocaleTimeString('en-US',{timeZone:'Asia/Karachi',hour12:true});}else{reportDate=String(d).slice(0,10);reportDateTime=String(d)}}

function totalRow(headers, data){
 const idx=(name)=>headers.findIndex(h=>String(h).toLowerCase()===name.toLowerCase());
 const row=new Array(headers.length).fill('');
 const labels=headers.map(h=>String(h).toLowerCase());
 if(labels.includes('school')) row[labels.indexOf('school')]='TOTAL';
 else if(labels.includes('markaz')) row[labels.indexOf('markaz')]='TOTAL';

        const barColor=pctv===maxAch?green:(pctv===minAch?red:yellow);
        doc.setFont('helvetica','normal');doc.setFontSize(7);doc.setTextColor(...textc);doc.text(String(r.name).slice(0,34),M,y+10,{maxWidth:120});
        const trackW=C-205;doc.setFillColor(235,239,244);doc.setDrawColor(...line);doc.roundedRect(M+135,y,trackW,12,3,3,'FD');
        const bw=Math.max(2,Math.min(trackW,trackW*pctv/100));doc.setFillColor(...barColor);doc.setDrawColor(...barColor);doc.roundedRect(M+135,y,bw,12,3,3,'F');
        doc.setFont('helvetica','bold');doc.setTextColor(...(pctv>=100?green:red));doc.text(pctv.toFixed(1)+'%',W-M-5,y+10,{align:'right'});
        y+=20;
      });
      
    }
    footer(page);
    const shortName=()=>{const t=getVal('tehsilFilter'),w=getVal('wingFilter'),q=getVal('search');const filterName=reportLabel();const p=[filterName,'Enrollment_Report',w&&'W-'+fileSafe(w),t&&'T-'+fileSafe(t),q&&'S-'+fileSafe(q)].filter(Boolean);return p.join('_')+'_'+stampNow()+'.pdf'}; doc.save(shortName());
  }catch(err){console.error('PDF export error:',err);alert('PDF generation failed. Please try again.');}
}
function loadLiveData(){
 window.__dashboardBoot.loading=false;
 try{
  const raw=LIVE_DATA;
  if(!Array.isArray(raw)||raw.length<1000) throw new Error('Live data incomplete: '+(raw.length||0)+' schools');
  const d=(raw[0]||{})['Run Date'], dt=d?new Date(d):null;
  if(dt&&!isNaN(dt)){reportDate=dt.toLocaleDateString('en-CA',{timeZone:'Asia/Karachi'});reportDateTime=dt.toLocaleDateString('en-GB',{timeZone:'Asia/Karachi'})+' '+dt.toLocaleTimeString('en-US',{timeZone:'Asia/Karachi',hour12:true});}
  rows=normalize(raw); if(rows.length<1000) throw new Error('Normalized data incomplete: '+rows.length);
  document.getElementById('app').style.display='block'; fillFilters(); render();
  const latestText=reportDateTime||reportDate||'Live'; document.getElementById('headerLatest').textContent='Latest SIS report: '+latestText;
  const status=document.getElementById('status'); if(status) status.textContent='LIVE • Latest SIS report: '+latestText;
 }catch(err){
  console.error('Live data load failed:',err); document.getElementById('headerLatest').textContent='Latest SIS report: Data unavailable';
  const be=document.getElementById('bootError'); if(be){be.style.display='block';be.textContent='Dashboard error: '+err.message+' ';const bt=document.createElement('button');bt.textContent='Refresh';bt.onclick=()=>location.reload();be.appendChild(bt);}
  const status=document.getElementById('status');if(status)status.textContent='SIS data could not be loaded. '+err.message;
 }
}
loadLiveData();
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentView=b.dataset.view;render()}));
['search','tehsilFilter','wingFilter','markazFilter','schoolLimit'].forEach(id=>document.getElementById(id).addEventListener('input',render));document.getElementById('downloadExcel').onclick=exportRows;document.getElementById('downloadPDF').onclick=exportPDF;
</script></body></html>
